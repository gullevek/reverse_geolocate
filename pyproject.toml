[project]
name = "reverse-geolocate"
version = "1.1.4"
description = "Reverse Geolocate from Lat/Long information and write location information into sidecard files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-xmp-toolkit>=2.1.0",
    "requests>=2.32.0",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.scripts]
reverse-geolocate = "reverse_geolocate.reverse_geolocate:main"

# MARK: build system
[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

# MARK: build target
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
# Test PyPI index for publishing to the test repository
[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

# __END__
