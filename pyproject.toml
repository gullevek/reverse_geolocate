[project]
name = "reverse-geolocate"
version = "2.0.0rc3"
description = "Reverse geolocate XMP sidecar files: fill in the location names from GPS data, Lightroom, Google Maps or OpenStreetMap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-xmp-toolkit>=2.1.0",
    "requests>=2.32.5",
    # MIN-PY 3.12: remove, typing.override is used then
    "typing-extensions>=4.4.0",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Clemens Schwaighofer", email = "gullevek@gullevek.org" }]
keywords = [
    "xmp",
    "sidecar",
    "reverse-geocoding",
    "geolocation",
    "gps",
    "lightroom",
    "openstreetmap",
    "google-maps",
    "photography",
]
# https://pypi.org/classifiers/
# no license classifier: the license is set with the SPDX expression in license
classifiers = [
    # set to "5 - Production/Stable" for a final release
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # MIN-PY: one entry for each supported version, from requires-python up
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://codeberg.org/HelperScripts/reverse-geolocate"
Repository = "https://codeberg.org/HelperScripts/reverse-geolocate"
Issues = "https://codeberg.org/HelperScripts/reverse-geolocate/issues"

[project.scripts]
reverse-geolocate = "reverse_geolocate.reverse_geolocate:main"

# MARK: build target
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
# Test PyPI index for publishing to the test repository
[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[build-system]
requires = ["uv_build>=0.11.0,<2.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]


# MARK: Python linting
[tool.pyright]
typeCheckingMode = "strict"
# minimum supported Python, same as requires-python (ruff and ty read requires-python)
# MIN-PY: keep in sync with requires-python
pythonVersion = "3.11"
# local type stubs (libxmp ships none)
stubPath = "typings"
reportMissingImports = "information"
reportMissingTypeStubs = "information"
reportUnknownMemberType = "information"
# src (set automatically if extraPaths is not set), shared test helpers (tests/helpers)
extraPaths = ["src", "tests"]
# Ty
[tool.ty.environment]
# local type stubs (libxmp ships none), shared test helpers (tests/helpers)
extra-paths = ["typings", "tests"]
[tool.ty.rules]
# ty has no strict mode; enabling all rules is the closest equivalent
all = "error"
import-not-found = "warn"
# Black (SUPERSEEDED BY RUFF format)
[tool.black]
# set 10 short for better formatting
line-length = 110
# to avoid " ... " " ... " string sets
# experimental-string-processing = true
preview = true
enable-unstable-feature = ["string_processing", "hug_parens_with_braces_and_square_brackets"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
# UP035: imports that can come from the standard library for the minimum Python (requires-python),
# e.g. typing_extensions.override -> typing.override once requires-python is >=3.12
extend-select = ["UP035"]
[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lint_isort_force-single-line
# force-single-line = true
combine-as-imports = true
[tool.ruff.format]
# set 10 short for better formatting
# line-length = 110
[tool.pylint.format]
max-line-length = 120
[tool.pylint.miscellaneous]
notes = ["FIXME", "TODO"]
notes-rgx = '(FIXME|TODO)(\((TTD-|#)\[0-9]+\))'
[tool.flake8]
max-line-length = 120
ignore = [
    "E741", # ignore ambigious variable name
    "W504"  # Line break occurred after a binary operator [wrong triggered by "or" in if]
]
[tool.pylint.MASTER]
# this is for the tests/etc folders
init-hook='import sys; sys.path.append("src/")'

# MARK: Testing
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# shared test helpers: from helpers.<module> import ...
pythonpath = [
    "tests",
]

[tool.coverage.run]
# also check that both outcomes of every if/loop are tested
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
