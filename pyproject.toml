[project]
name = "reverse-geolocate"
version = "2.0.0-rc-1"
description = "Reverse Geolcate script"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-xmp-toolkit>=2.1.0",
    "requests>=2.32.5",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.scripts]
reverse-geolocate = "reverse_geolocate.reverse_geolocate:main"

# MARK: build target
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
# Test PyPI index for publishing to the test repository
[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[build-system]
requires = ["uv_build>=0.11.0,<2.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]


# MARK: Python linting
[tool.pyright]
typeCheckingMode = "strict"
# local type stubs (libxmp ships none)
stubPath = "typings"
reportMissingImports = "information"
reportMissingTypeStubs = "information"
reportUnknownMemberType = "information"
# Ty
[tool.ty.environment]
# local type stubs (libxmp ships none)
extra-paths = ["typings"]
[tool.ty.rules]
# ty has no strict mode; enabling all rules is the closest equivalent
all = "error"
import-not-found = "warn"
# Black (SUPERSEEDED BY RUFF format)
[tool.black]
# set 10 short for better formatting
line-length = 110
# to avoid " ... " " ... " string sets
# experimental-string-processing = true
preview = true
enable-unstable-feature = ["string_processing", "hug_parens_with_braces_and_square_brackets"]
[tool.ruff]
line-length = 120
[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lint_isort_force-single-line
# force-single-line = true
combine-as-imports = true
[tool.ruff.format]
# set 10 short for better formatting
# line-length = 110
[tool.pylint.format]
max-line-length = 120
[tool.pylint.miscellaneous]
notes = ["FIXME", "TODO"]
notes-rgx = '(FIXME|TODO)(\((TTD-|#)\[0-9]+\))'
[tool.flake8]
max-line-length = 120
ignore = [
    "E741", # ignore ambigious variable name
    "W504"  # Line break occurred after a binary operator [wrong triggered by "or" in if]
]
[tool.pylint.MASTER]
# this is for the tests/etc folders
init-hook='import sys; sys.path.append("src/")'

# MARK: Testing
[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
# also check that both outcomes of every if/loop are tested
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
